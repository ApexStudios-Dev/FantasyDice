name: Publish

on:
  pull_request:
    types:
      - synchronize
      - opened
      - ready_for_review
      - reopened
  workflow_dispatch:
  push:
    branches: [ '**/main' ]
    paths: [ '**/src/**' ]

jobs:
  publish-mod:
    uses: ApexStudios-Dev/.github/.github/workflows/_publish-mod.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      publish-task: ':publishReleasePublicationToApexStudios-ReleasesRepository'
      curseforge-id: '835372' # '573867'
      modrinth-id: 'EjjiYArZ' # 'hPeyEJEZ'
      artifact-id: fantasydice
      display-name: Fantasy's Dice
      release-type: release
      logo-url: 'https://raw.githubusercontent.com/ApexStudios-Dev/.github/refs/heads/master/assets/minecraft/fantasydice/logo.png'
      color: 0xFFA8BF
